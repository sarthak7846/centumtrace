services:
  api:
    image: centumtrace-api:latest
    container_name: centumtrace-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  dashboard:
    image: centumtrace-fe:latest
    container_name: centumtrace-fe
    ports:
      - "3000:3000"
    environment:
      OBSERVE_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

